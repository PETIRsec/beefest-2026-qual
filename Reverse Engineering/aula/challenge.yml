name: "Aula"
category: Reverse Engineering
description: |-
    A lecturer left her phone on the desk. You are a student, you have your own
    app, and one run on her device before the screen is photographed and handed
    back to you. Everything the examinations board decided is on that phone and
    none of it is meant to reach you yet. Get it on screen.

    Grab the two APKs, reverse them, and write your own zero-permission APK that
    walks the whole way across the device. The range installs both apps, runs
    yours once, and gives you the screenshot.

    Author: lawbyte

